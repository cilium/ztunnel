name: E2E Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      cilium_version:
        description: "Cilium Helm chart version"
        required: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CILIUM_VERSION: ${{ inputs.cilium_version || 'v1.19.4' }}
  CILIUM_CLI_VERSION: v0.19.1

jobs:
  wait-for-image:
    name: Wait for CI Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute image reference
        id: image
        run: |
          SHA=$(git rev-parse HEAD)
          IMAGE="quay.io/${{ vars.QUAY_ORGANIZATION_DEV }}/ztunnel-ci:${SHA}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Waiting for image: ${IMAGE}"

      - name: Wait for image to be available
        run: |
          for i in $(seq 1 40); do
            if docker manifest inspect "${{ steps.image.outputs.image }}" &>/dev/null; then
              echo "Image is available!"
              exit 0
            fi
            echo "Attempt ${i}/40: Image not yet available, waiting 45s..."
            sleep 45
          done
          echo "::error::Timed out waiting for CI image"
          exit 1

  e2e-test:
    name: E2E Test (stable)
    needs: wait-for-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Resolve a trusted ref for composite actions and config files.
      # - Same-repo PR: PR head is trusted (maintainer-authored).
      # - Fork PR: PR head is NOT trusted; use the base branch instead.
      # - push / workflow_dispatch: use github.sha (already trusted).
      - name: Resolve trusted ref
        id: vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            CONTEXT_REF="${{ github.event.pull_request.base.sha }}"
          else
            CONTEXT_REF="${{ github.sha }}"
          fi
          echo "context-ref=${CONTEXT_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout context ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.vars.outputs.context-ref }}
          persist-credentials: false

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          config: .github/kind-config.yaml
          wait: 0  # Cilium is the CNI; nodes won't be Ready until it's installed

      - name: Generate ztunnel TLS certificates
        uses: ./.github/actions/ztunnel-certs

      - name: Install Cilium CLI
        uses: cilium/cilium-cli@e3a20f4df0e49da32a381e8c91748f311d404134 # v0.19.1
        with:
          skip-build: true
          release-version: ${{ env.CILIUM_CLI_VERSION }}

      # The ztunnel image is overridden via Helm so Cilium installs with the
      # PR-built image in one pass. The override Helm value
      # (encryption.ztunnel.image.override) was added upstream in cilium#43763
      # and backported to v1.19.2 via cilium#44593, so it requires v1.19.2+.
      - name: Install Cilium
        id: install-cilium
        run: |
          ZTUNNEL_IMAGE="${{ needs.wait-for-image.outputs.image }}"
          echo "Installing Cilium with ztunnel image override: ${ZTUNNEL_IMAGE}"

          cilium install \
            --version "${{ env.CILIUM_VERSION }}" \
            --wait \
            --helm-set=debug.enabled=true \
            --helm-set=encryption.enabled=true \
            --helm-set=encryption.type=ztunnel \
            --helm-set=encryption.ztunnel.image.override="${ZTUNNEL_IMAGE}" \
            --helm-set=kubeProxyReplacement=true \
            --helm-set=tunnelProtocol=vxlan

          cilium status --wait --interactive=false
          kubectl get pods --all-namespaces -o wide

          ACTUAL_IMAGE=$(kubectl -n kube-system get daemonset/ztunnel-cilium \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "Ztunnel image: ${ACTUAL_IMAGE}"
          if [ "${ACTUAL_IMAGE}" != "${ZTUNNEL_IMAGE}" ]; then
            echo "::error::Expected image ${ZTUNNEL_IMAGE}, got ${ACTUAL_IMAGE}"
            exit 1
          fi

      - name: Run connectivity tests
        id: connectivity-test
        run: |
          mkdir -p cilium-junits

          cilium connectivity test \
            --test="ztunnel-pod-to-pod-encryption" \
            --include-unsafe-tests \
            --collect-sysdump-on-failure \
            --flow-validation=disabled \
            --debug \
            --sysdump-output-filename="cilium-sysdump-e2e-ztunnel-<ts>" \
            --junit-file="cilium-junits/e2e-ztunnel.xml"

      - name: Collect ztunnel logs on failure
        if: failure() && steps.install-cilium.outcome != 'skipped'
        run: |
          kubectl -n kube-system describe daemonset/ztunnel-cilium | tee ztunnel-logs.txt || true
          kubectl -n kube-system logs -l app=ztunnel-cilium --tail=1000 | tee -a ztunnel-logs.txt || true
          # Only collect a sysdump here if the connectivity test didn't
          # already produce one via --collect-sysdump-on-failure (which only
          # fires when the test itself fails). Covers install / pre-test
          # failure modes.
          if [ "${{ steps.connectivity-test.outcome }}" != "failure" ]; then
            cilium sysdump --output-filename "cilium-sysdump-pre-test-<ts>" || true
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: |
            cilium-junits/
            cilium-sysdump*.zip
            ztunnel-logs.txt
          retention-days: 5
